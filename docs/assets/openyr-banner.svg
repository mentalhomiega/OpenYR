<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">OpenYR</title>
  <desc id="desc">OpenYR banner: an open-source rebuild of the Yuri's Revenge engine.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14061f"/>
      <stop offset="0.55" stop-color="#2a0b3d"/>
      <stop offset="1" stop-color="#3b0a1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c77dff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c77dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="text" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2c6ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>

  <!-- Emblem: rings of a pulse around a stylised Y -->
  <g transform="translate(210 160)">
    <circle r="150" fill="url(#glow)"/>
    <circle r="112" fill="none" stroke="#c77dff" stroke-opacity="0.25" stroke-width="2"/>
    <circle r="92" fill="none" stroke="#c77dff" stroke-opacity="0.45" stroke-width="3"/>
    <circle r="72" fill="none" stroke="#e0aaff" stroke-opacity="0.7" stroke-width="4"/>
    <polygon points="0,-58 50,-29 50,29 0,58 -50,29 -50,-29" fill="#1b0828" stroke="#e0aaff" stroke-width="4"/>
    <path d="M-24,-28 L0,4 L24,-28 M0,4 L0,34" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="410" y="170" font-size="120" font-weight="800" fill="url(#text)" letter-spacing="2">Open<tspan fill="#c77dff">YR</tspan></text>
    <text x="414" y="222" font-size="30" fill="#d9c2ee">An open-source rebuild of the Yuri's Revenge engine</text>
    <rect x="414" y="246" width="420" height="4" rx="2" fill="#c77dff" fill-opacity="0.8"/>
  </g>
</svg>
