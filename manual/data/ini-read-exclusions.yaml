    reason: These fields configure the legacy campaign-selection UI resource, not scenario gameplay data.
  - path: code/mschoice.cpp
    function: MapChoice::Initialize
    keys: [Anims, Palette, Sounds, TextRect]
    classification: excluded
    reason: These fields configure the legacy campaign-selection UI resource, not scenario gameplay data.
  - path: code/ui/screens/missionsel/uimissionseldlg.cpp
    function: Mission_Name
    keys: [UIName]
    classification: excluded
    reason: The Mission Select screen reads MISSIONMD.INI labels to name its list entries; the file is menu text, not game or mod data.
  - path: code/wdtcampaign.cpp
    function: Campaign::Campaign
    keys: [CampaignID, PlayerFaction, Previous]
    classification: excluded
    reason: These fields configure the legacy campaign-selection UI resource, not scenario gameplay data.
  - path: code/wdtcampaign.cpp
    function: WDT_Get_Campaign_ID
    keys: [CampaignID]
    classification: excluded
    reason: This lookup belongs to the legacy campaign-selection UI resource parser.
  - path: code/wdtsel.cpp
    function: Selection::Init_Dimensions
    keys: [CancelButtonRectangle, MapOrigin, Size, TextRect]
    classification: excluded
    reason: These fields configure the legacy campaign-selection UI layout, not game or mod data.
  - path: code/wdtsel.cpp
    function: Selection::Init_Voices
    keys: [LosingThreshold, MegaLosingThreshold, MegaWinningThreshold, WinningThreshold]
    classification: excluded
    reason: These fields configure the legacy campaign-selection UI voice thresholds, not game or mod data.
  - path: code/wdtsel.cpp
    function: Selection::Init_Regions
