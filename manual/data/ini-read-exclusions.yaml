    function: Mission_Briefing
    keys: [Briefing]
    classification: excluded
    reason: A campaign mission's briefing label, read from MISSIONMD.INI and then MISSION.INI; the objectives screen shows the text it names, so it is menu text rather than game data.
  - path: code/ui/screens/missionbrowser/uimissionbrowserdlg.cpp
    function: Mission_Title
    keys: [UIName]
    classification: excluded
    reason: A Red Alert 2 mission's name label in MISSION.INI, which the browser shows as menu text; the label is not game or mod data.
  - path: code/ui/screens/missionbrowser/uimissionbrowserdlg.cpp
    function: Read_Art_Entry
    keys: [LS800BkgdPal]
    classification: excluded
    reason: A setting of a campaign mission's section in MISSIONMD.INI or MISSION.INI, documented as that format rather than as game data.

  # A seat's free color in a launch file, read from the per-seat section that the CnCNet client numbers.
  - path: code/spawnerconfig.cpp
    function: Read_Free_Color
    keys: [ColorRGB]
    classification: excluded
    reason: Each names one seat of a match inside a section the CnCNet client numbers per seat, not an authored game-data setting.
