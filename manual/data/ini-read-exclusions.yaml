  - path: code/vox.cpp
    function: Append_Eva_Lines
    keys: [Type, Priority, Volume]
    classification: excluded
    reason: Each is a setting of an announcer line in the EVA file, documented as that format rather than as game data.

  - path: code/loadscreen.cpp
    function: LoadScreenClass::Begin_Campaign
    keys: [LS800BkgdPal, LSLoadMessage, LSLoadBriefing]
    classification: excluded
    reason: Each is a setting of a campaign mission's section in MISSIONMD.INI, documented as that format rather than as game data.

  - path: code/loadscreen.cpp
    function: Coop_Picture
    keys: [NumberOfCampaignMaps, CampaignLoadScreen, CampaignLoadScreenPallet]
    classification: excluded
    reason: Each is a setting of a co-op campaign's section in COOPCAMPMD.INI, documented on the loading screens page rather than as game data.

  - path: code/scenario.cpp
    function: Read_Scenario_INI
    keys: [NumCoopHumanStartSpots]
    classification: excluded
    reason: A setting of a map's Header section, documented with the start position rules on the starting forces page rather than as game data.

  - path: code/deploymentconfig.cpp
    function: DeploymentConfigClass::Read_INI
    keys: [SearchPaths, Mods, DataDirectory, UserDirectory, CarryScenarioFile, Rules, RulesExpansion, Art, ArtExpansion, RA2Art, RA2Rules, RA2Eva, AI, AIExpansion, Sound, SoundExpansion, Theme, ThemeExpansion, Eva, Battle, BattleExpansion, LanguageRules, LanguageRulesExpansion, MultiplayerRules, MultiplayerRulesExpansion, Tutorial, UI, Settings, Keyboard, Scheme, Game]
    classification: excluded
    reason: Each is a setting of the deployment's own file, documented as that format rather than as game data.

  - path: code/mods.cpp
    function: Read_Manifest
    keys: [Name, Description]
    classification: excluded
    reason: Each is a setting of a mod folder's own mod.ini, documented as that format rather than as game data.

  - path: code/spawnerconfig.cpp
    function: SpawnerConfigClass::Read_Slots
    keys: [Color, Side, Port]
    classification: excluded
    reason: Each names one seat of a match inside a section the CnCNet client numbers per seat, not an authored game-data setting.
  - path: code/spawnerconfig.cpp
    function: SpawnerConfigClass::Read_INI
    keys: [AIDifficulty, AIPlayers, AutoSaveGame, AutoSaveInterval, CampaignID, ConnTimeout, Credits, DifficultyModeComputer, DifficultyModeHuman, GameMode, GameSpeed, NextSPAutoSaveId, NextSkirmishAutoSaveId, Port, ReconnectTimeout, Seed, TechLevel, UnitCount]
    classification: excluded
    reason: The CnCNet client writes these per launch to describe one match, so they are not part of the authored game-data key catalog.
  - path: code/mpmodeparse.cpp
    function: MPMode_Read_Dialog_Settings
    keys: [AlliesAllowed, MustAlly]
    classification: excluded
    reason: Each multiplayer mode names its own small overrides file in MPModesMD.ini, and these lobby settings are read from that file, not from the rules or art data the key catalog covers.

  - path: code/truecolour.cpp
    function: Png_Only_Layout
    keys: [FrameWidth, FrameHeight, Frames]
    classification: excluded
    reason: Each is a setting of a PNG sprite sheet's own .ini file, documented as that format in docs/TRUECOLOUR.md rather than as game data.

  - path: code/house.cpp
    function: House_Type_For_Entry
    keys: [Country]
    classification: duplicate
    canonical_key: Country
    reason: The house record picks its type from the same Country setting that HouseClass::Read_INI reads for the tech tree.

  - path: code/scenario.cpp
    function: Side_For_Map_House
    keys: [Country]
    classification: duplicate
    canonical_key: Country
    reason: Reads the Country setting of the player house before the houses exist, to choose the side whose archives load.
  - path: code/scenario.cpp
    function: Side_For_Map_House
    keys: [Side]
    classification: duplicate
    canonical_key: Side
    reason: Reads the Side setting of the player's country before the countries exist, to choose the side whose archives load.
  - path: code/scenario.cpp
    function: Side_For_Map_House
    keys: [ParentCountry]
    classification: duplicate
    canonical_key: ParentCountry
    reason: Follows the ParentCountry setting of the player's country before the countries exist, to choose the side whose archives load.

  # Choices the skirmish and LAN screens write back to RA2MD.INI and read again when they open.
  - path: code/netdlg2.cpp
    function: Load_Lan_Map
    keys: [Map]
    classification: excluded
    reason: The map a host last picked in a LAN lobby, which the lobby writes to [LAN] when a map is picked; it is remembered state, not a setting.
  - path: code/ui/screens/skirmish/uiskirmishdlg.cpp
    function: Load_Memory
    keys: [Map, Units, Credits, Tech, Speed, Bases, Crates, Fog, Bridges, Redeploy, ShortGame, Engineer, SuperWeapons, BuildOffAlly]
    classification: excluded
    reason: The setup the skirmish screen remembers in [Skirmish], which the screen writes when it closes; the skirmish setup page owns it, and a launch file does not use it.

  # Map sizing for the menu battle's choice of map.
  - path: code/shellmap.cpp
    function: Visible_Map_Size
    keys: [LocalSize]
    classification: duplicate
    canonical_key: LocalSize
    reason: The menu battle sizes a map from its [Map] LocalSize, the same setting DisplayClass already extracts from the map file.
  # Settings for the menu battle's own setup, which the settings screen does not expose.
  - path: code/shellmap.cpp
    function: Pick_Map
    keys: [Map]
    classification: excluded
    reason: Tuning for the menu battle's own setup, which no manual page documents; the switch players see is the Options MenuBattle key.
  - path: code/shellmap.cpp
    function: Prepare_Battle
    keys: [Players, Credits, SuperWeapons]
    classification: excluded
    reason: Tuning for the menu battle's own setup, which no manual page documents; the switch players see is the Options MenuBattle key.
  - path: code/shellmap.cpp
    function: Shellmap_Enabled
    keys: [InTests]
    classification: excluded
    reason: A switch the menu battle test scripts write with -Settings so the battle runs during a test; the manual does not document it.

  # Campaign mission labels and palettes that the mission browser shows as menu text.
