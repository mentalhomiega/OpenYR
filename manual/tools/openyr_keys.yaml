# Inputs for manual/tools/openyr_keys.py, which writes docs/OPENYR_KEYS.md.
#
# The script finds keys in the change records of manual/changes/ and the key
# catalog in data/ini-keys.yaml. A change record says that OpenYR started
# reading a key. It does not say whether gamemd reads that key too, so each
# record that adds a key is classified here. A record whose file name starts
# with "yr-" ports gamemd behavior and needs no entry.
#
# Add a record to the right list when `openyr_keys.py --check` reports it as
# unclassified. Change a record's list only with evidence: a key that
# Yuri's Revenge reads belongs under gamemd.

version: 1

