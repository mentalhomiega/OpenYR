; Bombs for a bridge repair hut: one that destroys the bridge beside it and one that does not.
[BombBridge]
Damage=1
ROF=100
Range=8
Speed=100
Projectile=Invisible
Warhead=BombWHA
IvanBomb.Delay=30
IvanBomb.DestroysBridges=yes

[BombNoBridge]
Damage=1
ROF=100
Range=8
Speed=100
Projectile=Invisible
Warhead=BombWHA
IvanBomb.Delay=30
IvanBomb.DestroysBridges=no
