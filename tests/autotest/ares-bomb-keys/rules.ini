; Rules overlay of the Ares Ivan bomb key test mod.
[CombatDamage]
IvanTimedDelay=90
IvanDamage=33
IvanWarhead=BombBlastWH

[Weapons]
901=BombA
902=BombB
903=DefuseA
904=BombBridge
905=BombNoBridge

[Warheads]
901=BombWHA
902=BombBlastWH
903=BombBlastWH2
904=DefuseWH

[BombWHA]
IvanBomb=yes
Verses=100%,100%,100%,100%,100%,100%,100%,100%,100%,100%,100%

[BombBlastWH]
Verses=100%,100%,100%,100%,100%,100%,100%,100%,100%,100%,100%

[BombBlastWH2]
Verses=100%,100%,100%,100%,100%,100%,100%,100%,100%,100%,100%

[DefuseWH]
BombDisarm=yes
Verses=100%,100%,100%,100%,100%,100%,100%,100%,100%,100%,100%

; A bomb with its own delay, damage and warhead that an engineer cannot remove and that goes off when its building is sold.
[BombA]
Damage=1
ROF=100
Range=8
Speed=100
Projectile=Invisible
Warhead=BombWHA
IvanBomb.Delay=80
IvanBomb.Damage=77
IvanBomb.Warhead=BombBlastWH2
IvanBomb.Detachable=no
IvanBomb.DetonateOnSell=yes
IvanBomb.Image=PIPS

; A bomb that follows the rules' settings.
[BombB]
Damage=1
ROF=100
Range=8
Speed=100
Projectile=Invisible
Warhead=BombWHA

[DefuseA]
Damage=1
ROF=30
Range=8
Speed=100
Projectile=Invisible
