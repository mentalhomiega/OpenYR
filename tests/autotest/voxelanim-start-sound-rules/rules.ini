; Rules overlay for voxelanim-start-sound.txt. A Rhino tank that dies throws two debris pieces. Each piece borrows
; the Rhino body voxel and starts OilDerrickLoop, a stock endless loop, when it is created.
[HTNK]
MinDebris=2
MaxDebris=3
DebrisTypes=DEBRISLOOP
DebrisMaximums=1

[VoxelAnims]
1=DEBRISLOOP

[DEBRISLOOP]
ShareBodyData=yes
ShareSource=HTNK
StartSound=OilDerrickLoop
Duration=60
