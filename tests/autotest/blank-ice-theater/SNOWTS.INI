; Tile set file of the blank ice theater test mod. The sets use the artwork Yuri's Revenge ships for its snow theater.
; Tile numbers: 0 clear, 1 to 20 ramps, 21 to 30 rough ground, 31 and up the blank ice sets (no tiles), then rough
; ground at 31 to 40 and ramps at 41 to 60. The first ice set's number is 31, so a theater that reads ice sets
; counts the tiles 32 to 93 as ice.
