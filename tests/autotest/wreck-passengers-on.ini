; Rules and art overlay read by wreck-passengers-on.txt through the "art" verb: an IFV (FV) with DeathFrames, so it
; becomes a wreck when destroyed, and WreckReleasesPassengers=yes, which releases its passengers when it becomes one.
; The wreck stays for 400 game frames before it explodes.
[VehicleTypes]
0=FV

[FV]
DeathFrames=2
MaxDeathCounter=400
WreckReleasesPassengers=yes
