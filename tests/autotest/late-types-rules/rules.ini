; Rules overlay of the late types test mod. Every type below has a section, and no weapon is listed in [WeaponTypes].
; Types a unit, an infantry type, [General] or a superweapon names are read in gamemd, because those are read before the
; weapon list (DeathWeapon on E1, ElitePrimary on E1, OccupyWeapon and EliteOccupyWeapon on GGI, DropPodWeapon, WeaponType
; on a superweapon). So are the projectile and warhead a read weapon names, and a warhead [CombatDamage] or
; [SpecialWeapons] names, because [SpecialWeapons] reads every warhead again.
; Types named after their list was read are not: [CombatDamage] DeathWeapon, [SpecialWeapons] NukeProjectile, and the
; AirburstWeapon and ShrapnelWeapon of a projectile (the projectile list follows the weapon list).
[General]
DropPodWeapon=ReadPodGun

[E1]
DeathWeapon=ReadDeathGun
ElitePrimary=ReadEliteGun

[GGI]
OccupyWeapon=ReadOccupyGun
EliteOccupyWeapon=ReadEliteOccupyGun

