; An inaccurate arcing shell that scatters exactly one cell, and one with only Max set (half a cell, as Min is half the global value).
[ScatterGun]
Damage=10
ROF=200
Range=8
Speed=20
Projectile=ScatterShell
Warhead=HE

[ScatterShell]
Image=120MM
Arcing=yes
Inaccurate=yes
AG=yes
BallisticScatter.Min=1
BallisticScatter.Max=1

[ScatterGun2]
Damage=10
ROF=200
Range=8
Speed=20
Projectile=ScatterShell2
Warhead=HE

[ScatterShell2]
Image=120MM
Arcing=yes
Inaccurate=yes
AG=yes
BallisticScatter.Max=0.5

