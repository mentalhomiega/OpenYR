; Rules overlay for zero-damage-armor-effect.txt: a Grizzly tank that dies sets off a weapon with no damage whose warhead reaches 25 cells and
; attaches an effect with an armor multiplier of zero for 400 frames.
[MTNK]
Explodes=yes
DeathWeapon=TestArmorGift

[TestArmorGift]
Damage=0
ROF=10
Range=1
Speed=100
Projectile=Invisible
Warhead=TestArmorGiftWH

[Warheads]
900=TestArmorGiftWH

[TestArmorGiftWH]
Verses=100%,100%,100%,100%,100%,100%,100%,100%,100%,100%,100%
CellSpread=25
AttachEffect.Duration=400
AttachEffect.ArmorMultiplier=0
