; A storm that sets its own timing, damage, lighting and cloud and bolt lists.
[TestStorm]
UIName=NOSTR:Test storm
Type=LightningStorm
Action=Custom
RechargeTime=0.1
Cursor=Attack
SW.Deferment=1
SW.Damage=300
SW.Warhead=HE
Lightning.Duration=150
Lightning.HitDelay=10
Lightning.ScatterDelay=0
Lightning.DebrisMin=0
Lightning.DebrisMax=0
Lightning.RadarOutage=40
Light.Ambient=50
Light.Red=30
Light.Green=40
Light.Blue=200

; A dominator that takes enemy vehicles within 3 cells and leaves infantry alone.
[TestDom]
UIName=NOSTR:Test dominator
Type=PsychicDominator
Action=Custom
RechargeTime=0.1
Cursor=Attack
SW.Range=3
SW.AffectsHouse=enemies
SW.AffectsTarget=units
SW.Damage=0
Dominator.FireAtPercentage=10
Light.Ambient=60
Light.Red=150
Light.Green=50
Light.Blue=50

; A nuclear missile that lights the flash with its own values.
[TestNukeLit]
UIName=NOSTR:Test nuke lit
Type=MultiMissile
Action=Custom
RechargeTime=0.1
WeaponType=NukeCarrier
Cursor=Nuke
Light.Ambient=70
Light.Red=10
Light.Green=20
Light.Blue=30

; The same missile with no flash.
[TestNukeDark]
UIName=NOSTR:Test nuke dark
Type=MultiMissile
Action=Custom
RechargeTime=0.1
WeaponType=NukeCarrier
Cursor=Nuke
Light.Enabled=no

; Chronosphere that moves vehicles of the owner's team only and kills nothing.
[TestChrono]
UIName=NOSTR:Test chrono
Type=ChronoSphere
Action=Custom
RechargeTime=10
PreClick=yes
Cursor=Chronosphere
SW.Range=1,1
SW.AffectsTarget=units

[TestChronoB]
UIName=NOSTR:Test chrono B
Type=ChronoSphere
Action=Custom
RechargeTime=10
PreClick=yes
Cursor=Chronosphere
SW.Range=3,3
Chronosphere.KillOrganic=no
Chronosphere.BlastSrc=DOMRING
Chronosphere.KillCargo=yes

