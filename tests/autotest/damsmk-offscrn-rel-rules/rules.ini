; Rules overlay for damsmk-offscrn-rel.txt. HTNK and E1 set DamSmkOffScrnRel=yes, so their offsets are screen
; relative. MTNK leaves the key out, so its offset is world relative, as the default is.
[HTNK]
DamageSmokeOffset=300,0,40
DamSmkOffScrnRel=yes

[E1]
DamageSmokeOffset=-300,120,-25
DamSmkOffScrnRel=yes

[MTNK]
DamageSmokeOffset=300,0,40
