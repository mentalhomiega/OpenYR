; Rules overlay for weapon-turret-index.txt: the IFV reads 100 weapon positions, Weapon100 is a machine gun, and WeaponTurretIndex maps
; Weapon3 to turret 3 and Weapon100 to turret 1. WeaponTurretIndex1 names a turret the IFV does not have. The GI selects Weapon3 and the
; engineer Weapon100.
[FV]
WeaponCount=100
Weapon100=M60
EliteWeapon100=M60
WeaponTurretIndex1=500
WeaponTurretIndex3=3
WeaponTurretIndex100=1

[E1]
IFVMode=2

[ENGINEER]
IFVMode=99
