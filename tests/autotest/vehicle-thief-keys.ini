; Rules overlay for vehicle-thief-keys.txt: three unarmed vehicle thieves that the Yuri Mastermind cannot control.
; CIV1 is used up by a theft, CIV2 plays SellBuilding when it steps out of a destroyed vehicle, and CIV3 may not take
; a mind-controlled vehicle.
[CIV1]
VehicleThief=yes
VehicleThief.OneTime=yes
ImmuneToPsionics=yes

[CIV2]
VehicleThief=yes
VehicleThief.LeaveSound=SellBuilding
ImmuneToPsionics=yes

[CIV3]
VehicleThief=yes
VehicleThief.BreakMindControl=no
ImmuneToPsionics=yes
