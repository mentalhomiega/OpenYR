; Rules and art overlay for attach-anim-emissive.txt, read through the "art" step. The Apocalypse tank (HTNK) shows RING1 and
; the Grizzly tank (MTNK) shows SMOKEY for as long as they live. Both animations are self-lit and translucent, which gives
; an animation an emissive strength of 200 by default. SMOKEY also has an Emissive= key.
[HTNK]
AttachEffect.Duration=-1
AttachEffect.Animation=RING1

[MTNK]
AttachEffect.Duration=-1
AttachEffect.Animation=SMOKEY

[RING1]
UseNormalLight=yes
Translucency=75

[SMOKEY]
UseNormalLight=yes
Translucency=75
Emissive=120
