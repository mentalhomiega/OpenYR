; Test mod for the mission browser and the Red Alert 2 mission checks. Its battle file lists the Red Alert 2
; campaigns the way the CnCNet client's battle list does, with Scenario=RA2->MAP.MAP entries, so the browser
; shows them and the autotest can start them. The maps themselves come from the installed game files.
; Pass it with -Mods, as tests/autotest/mission-browser-ra2.txt shows.
[Mod]
Name=Red Alert 2 campaign list test
Description=Lists the Red Alert 2 campaigns in a battle file, for the mission browser and the campaign load checks.
