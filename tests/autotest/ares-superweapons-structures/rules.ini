; A warp that is listed before the follow-up the chronospheres name, so a chronosphere without SW.PostDependent would use it.
[TestLiftDecoy]
UIName=NOSTR:Test lift decoy
Type=ChronoWarp
Action=Custom
RechargeTime=0.1
PostClick=yes
PreDependent=ChronoSphere
Cursor=Chronosphere

; Moves the owner's structures within 1 cell of the picked cell, and leaves one that does not fit where it stands.
[TestLiftStay]
UIName=NOSTR:Test lift stay
Type=ChronoSphere
Action=Custom
RechargeTime=10
PreClick=yes
Cursor=Chronosphere
SW.Range=3,3
SW.AffectsHouse=owner
SW.AffectsTarget=buildings
Chronosphere.ReconsiderBuildings=yes
Chronosphere.BlowUnplaceable=no
SW.PostDependent=TestLiftPost

[TestLiftBlow]
UIName=NOSTR:Test lift blow
Type=ChronoSphere
Action=Custom
RechargeTime=10
PreClick=yes
Cursor=Chronosphere
SW.Range=3,3
SW.AffectsHouse=owner
SW.AffectsTarget=buildings
SW.PostDependent=TestLiftPost

; Lands only near a missile silo.
[TestLiftPost]
UIName=NOSTR:Test lift post
Type=ChronoWarp
Action=Custom
RechargeTime=0.1
PostClick=yes
PreDependent=ChronoSphere
Cursor=Chronosphere
SW.Designators=NAMISL

; Shifts units only, and a structure flagged Chronoshift.IsVehicle as a unit.
[TestVeh]
UIName=NOSTR:Test veh
Type=ChronoSphere
Action=Custom
RechargeTime=10
PreClick=yes
Cursor=Chronosphere
SW.Range=3,3
SW.AffectsHouse=owner
SW.AffectsTarget=units
SW.PostDependent=TestLiftPost

; Shifts infantry only, and any structure that can undeploy.
[TestUndeploy]
UIName=NOSTR:Test undeploy
Type=ChronoSphere
Action=Custom
RechargeTime=10
PreClick=yes
Cursor=Chronosphere
SW.Range=3,3
SW.AffectsHouse=owner
SW.AffectsTarget=infantry
Chronosphere.AffectsUndeployable=yes
SW.PostDependent=TestLiftPost

